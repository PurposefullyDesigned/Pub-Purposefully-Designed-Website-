<svg viewBox="0 0 550 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Butterfly -->
  <g id="butterfly">
    <!-- Left wing upper -->
    <path d="M 120 180 Q 100 140 110 100 Q 125 80 145 95 Q 135 130 140 160" fill="none" stroke="#5FB8C4" stroke-width="3" stroke-linecap="round"/>
    <!-- Left wing lower -->
    <path d="M 120 180 Q 90 200 80 240 Q 75 260 95 255 Q 110 220 125 190" fill="none" stroke="#5FB8C4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right wing upper -->
    <path d="M 180 180 Q 200 140 190 100 Q 175 80 155 95 Q 165 130 160 160" fill="none" stroke="#5FB8C4" stroke-width="3" stroke-linecap="round"/>
    <!-- Right wing lower -->
    <path d="M 180 180 Q 210 200 220 240 Q 225 260 205 255 Q 190 220 175 190" fill="none" stroke="#5FB8C4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body -->
    <circle cx="150" cy="180" r="8" fill="#5FB8C4"/>
    
    <!-- Antennae -->
    <path d="M 145 172 Q 135 155 130 140" fill="none" stroke="#5FB8C4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 155 172 Q 165 155 170 140" fill="none" stroke="#5FB8C4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="140" r="3" fill="#5FB8C4"/>
    <circle cx="170" cy="140" r="3" fill="#5FB8C4"/>
  </g>
  
  <!-- Text: "Purposefully Designed" -->
  <text x="270" y="220" font-family="cursive, serif" font-size="48" font-weight="300" fill="#C8A2E0" letter-spacing="2">
    Purposefully
  </text>
  <text x="270" y="270" font-family="cursive, serif" font-size="48" font-weight="300" fill="#C8A2E0" letter-spacing="2">
    Designed
  </text>
  
  <!-- Tagline: "Designed With A Purpose In Mind" -->
  <text x="30" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="300" letter-spacing="3" fill="#9B7FB8">
    Designed With A Purpose In Mind
  </text>
</svg>